# Pinned toolchain (ADR-0010). Bootstrap: `mise install && mise run setup`.
# Versions are exact; Renovate proposes updates (renovate.json).
min_version = "2026.10.0"

[tools]
node = "24.21.0"
"github:quarto-dev/quarto-cli" = "1.10.19"
# conda: gives prebuilt Linux/macOS binaries (no source build).
"conda:ffmpeg" = "9.0.2"
lefthook = "2.2.2"
shellcheck = "0.11.0"
# Explicit backends so Renovate can resolve them.
"aqua:mvdan/sh" = "3.14.1"
"aqua:JohnnyMorganz/StyLua" = "2.6.0"
"aqua:Kampfkarren/selene" = "0.32.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.setup]
description = "Install git hooks (pre-commit, pre-push)"
run = "lefthook install"

[tasks.check]
description = "Static checks on all code: line limit, format, lint, typecheck"
run = "scripts/check.sh --all"

[tasks.test]
description = "All test suites"
run = "scripts/test.sh --all"
